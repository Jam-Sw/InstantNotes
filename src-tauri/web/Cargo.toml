[package]
name = "instantnotes-web"
version = "0.1.0"
description = "InstantNotes web core: the core library compiled to WebAssembly for the browser. No Tauri."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_family = "wasm")'.dependencies]
instantnotes-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "Headers", "Request", "RequestInit", "RequestCredentials", "Response", "WorkerGlobalScope"] }
console_error_panic_hook = "0.1"
sqlite-wasm-rs = "0.6"
sqlite-wasm-vfs = "0.3"
