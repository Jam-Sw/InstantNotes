[package]
name = "instantnotes-web"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Strict-1.0.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_family = "wasm")'.dependencies]
instantnotes-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "Headers", "Request", "RequestInit", "RequestCredentials", "Response", "WorkerGlobalScope"] }
console_error_panic_hook = "0.1"
sqlite-wasm-rs = "0.5"
sqlite-wasm-vfs = "0.2"
