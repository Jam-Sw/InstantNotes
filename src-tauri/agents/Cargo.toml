[package]
name = "instantnotes-agents"
version = "0.9.0"
description = "InstantNotes agent access: an MCP server over stdio. No UI, no Tauri."
edition = "2021"

[dependencies]
instantnotes-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
