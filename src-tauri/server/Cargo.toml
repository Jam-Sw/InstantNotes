[package]
name = "instantnotes-server"
version = "0.11.2"
description = "InstantNotes sync server: per-person encrypted sync and the web app. No Tauri."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "instantnotes_server"
path = "src/lib.rs"

[[bin]]
name = "instantnotes-server"
path = "src/main.rs"

[dependencies]
instantnotes-core = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.10"
base64 = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
rusqlite = { workspace = true }
governor = "0.10"
chacha20poly1305 = "0.11"
hkdf = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
aws-lc-rs = "1"
