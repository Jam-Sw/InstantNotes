[workspace]
members = ["core", "agents", "server", "web"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "PolyForm-Strict-1.0.0"
repository = "https://github.com/Jam-Sw/InstantNotes"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.23"
sha2 = "0.11"
hkdf = "0.13"
tempfile = "3"
instantnotes-core = { path = "core" }

[package]
name = "instantnotes"
version = "0.11.2"
description = "InstantNotes — instant capture, organized knowledge"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "instantnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
instantnotes-core = { workspace = true }
instantnotes-agents = { path = "agents" }
instantnotes-server = { path = "server" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tauri-plugin-dialog = "2"
keyring = "4"
chrono = { workspace = true }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = { workspace = true }

[target."cfg(target_os = \"linux\")".dependencies]
tempfile = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.release.package.instantnotes-core]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3
