# Merging into main releases the version in package.json, unless that version
# is already published. Every build runs on the self-hosted Linux build
# machine: Linux in an Ubuntu 22.04 build root, Windows cross-compiled with
# cargo-xwin, and macOS on the Mac builder over ssh. Each platform succeeds or fails on its own; the release publishes
# with whatever built, and a platform that failed can be added later by
# re-running its job (re-run publish afterwards to refresh latest.json).
#
# Runner requirements (labels self-hosted, Linux, X64): node, gh, rustup with
# x86_64-pc-windows-msvc, cargo-xwin, makensis, `instantnotes-buildroot` (an
# Ubuntu 22.04 root for the AppImage), and an ssh host `mac-builder`.
# Repo secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ship: ${{ steps.plan.outputs.ship }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tauri="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          if [ "$tauri" != "$version" ] || [ "$cargo" != "$version" ]; then
            echo "::error::versions disagree: package.json $version, tauri.conf.json $tauri, Cargo.toml $cargo"
            exit 1
          fi
          state="$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$state" = false ]; then
            echo "v$version is already published; nothing to release."
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ship=true" >> "$GITHUB_OUTPUT"
          if [ "$state" = none ]; then
            node .github/release-notes.mjs "$version" > notes.md
            gh release create "v$version" --draft --target "$GITHUB_SHA" \
              --title "InstantNotes v$version" --notes-file notes.md
          fi

  linux:
    needs: plan
    if: needs.plan.outputs.ship == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      # Caches outside the workspace survive between runs, so builds stay warm.
      - run: echo "INSTANTNOTES_BUILDCACHE=$HOME/.cache/instantnotes-build/linux" >> "$GITHUB_ENV"
      - run: instantnotes-buildroot run . sh -c 'npm ci --no-audit --no-fund && npm run tauri -- build --bundles appimage'
      - run: |
          dir="$INSTANTNOTES_BUILDCACHE/target/release/bundle/appimage"
          gh release upload "v$VERSION" --clobber \
            "$dir/InstantNotes_${VERSION}_amd64.AppImage" \
            "$dir/InstantNotes_${VERSION}_amd64.AppImage.sig"

  windows:
    needs: plan
    if: needs.plan.outputs.ship == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/instantnotes-build/windows/target" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run tauri -- build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
      - run: |
          dir="$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/bundle/nsis"
          gh release upload "v$VERSION" --clobber \
            "$dir/InstantNotes_${VERSION}_x64-setup.exe" \
            "$dir/InstantNotes_${VERSION}_x64-setup.exe.sig"

  macos:
    needs: plan
    if: needs.plan.outputs.ship == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      # The Mac builds only while its owner runs instantnotes-builder there; it
      # gets this commit's files and builds unsigned, and the bundle is signed
      # here. Offline means this release ships without macOS.
      - id: mac
        run: |
          if [ "$(ssh -o BatchMode=yes -o ConnectTimeout=10 mac-builder status 2>/dev/null)" != online ]; then
            echo "::warning::Mac builder offline; v$VERSION ships without macOS"
            exit 0
          fi
          out="$RUNNER_TEMP/macos"
          mkdir -p "$out"
          git archive "$GITHUB_SHA" | ssh -o BatchMode=yes mac-builder "build $VERSION" | tar -xf - -C "$out"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - if: steps.mac.outputs.out
        run: |
          npm ci --no-audit --no-fund
          npx tauri signer sign "$OUT/InstantNotes_${VERSION}_aarch64.app.tar.gz"
          gh release upload "v$VERSION" --clobber "$OUT"/InstantNotes_"$VERSION"_aarch64.*
        env:
          OUT: ${{ steps.mac.outputs.out }}

  publish:
    needs: [plan, linux, windows, macos]
    if: always() && needs.plan.outputs.ship == 'true'
    runs-on: [self-hosted, Linux, X64]
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: node .github/release-manifest.mjs "$VERSION"
